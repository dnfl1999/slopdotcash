name: Cross-branch scoring validation
on:
  push:
    branches: [validation/cross-branch-9d2f937d-20261023]
permissions:
  contents: read
jobs:
  exact-revision:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base
            sha: 02d3055676ee8f6de8f5b692591040ea8039f9da
          - label: head
            sha: 9d2f937d4e9cbd63484ed986544666bbacb52401
    env:
      CI: "true"
      EXPECTED_SHA: ${{ matrix.sha }}
      SLOP_PROFILES_INPUT: data/profiles/seed.json
      SLOP_POINTS_ONLINE: "0"
      SLOP_POINTS_BOOTSTRAP: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Record exact Linux checkout and toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(node --version)" = "v24.15.0"
          test "$(bun --version)" = "1.3.14"
          {
            uname -a
            pwd
            df -T .
            git rev-parse HEAD
            git remote -v
            node --version
            bun --version
            python --version
          } | tee "$RUNNER_TEMP/evidence/environment.log"
      - name: Install frozen dependencies and validator
        run: |
          bun install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/evidence/install.log"
          python -m pip install --disable-pip-version-check PyYAML==6.0.3
          git diff --exit-code
      - name: Focused regression
        id: focused
        continue-on-error: true
        run: |
          set +e
          bun test scripts/commit-credit-owner-any-base.test.ts scripts/search-recovery.test.ts 2>&1 | tee "$RUNNER_TEMP/evidence/focused.log"
          status=${PIPESTATUS[0]}
          echo "$status" > "$RUNNER_TEMP/evidence/focused.exit"
          exit "$status"
      - name: Complete verify on fork configuration
        id: verify
        continue-on-error: true
        run: |
          set +e
          bun run verify 2>&1 | tee "$RUNNER_TEMP/evidence/verify.log"
          status=${PIPESTATUS[0]}
          echo "$status" > "$RUNNER_TEMP/evidence/verify.exit"
          exit "$status"
      - name: Isolate origin-dependent escrow fixture failures
        continue-on-error: true
        run: |
          original_origin="$(git remote get-url origin)"
          trap 'git remote set-url origin "$original_origin"' EXIT
          git remote set-url origin https://github.com/SlopDotCash/slopdotcash.git
          set +e
          bun test scripts/escrow-review-publication.test.ts 2>&1 | tee "$RUNNER_TEMP/evidence/escrow-upstream-origin-diagnostic.log"
          status=${PIPESTATUS[0]}
          echo "$status" > "$RUNNER_TEMP/evidence/escrow-upstream-origin-diagnostic.exit"
          exit "$status"
      - name: Generate build input from committed empty registry
        if: matrix.label == 'head'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun run leaderboard:generate 2>&1 | tee "$RUNNER_TEMP/evidence/leaderboard-input.log"
      - name: Install user-space test browsers
        if: matrix.label == 'head'
        run: bun x playwright install chromium firefox
      - name: Complete browser E2E on exact head
        id: e2e
        if: matrix.label == 'head'
        continue-on-error: true
        run: |
          set +e
          bun run test:e2e 2>&1 | tee "$RUNNER_TEMP/evidence/e2e.log"
          status=${PIPESTATUS[0]}
          echo "$status" > "$RUNNER_TEMP/evidence/e2e.exit"
          exit "$status"
      - name: Remaining suites after short-circuiting verify
        if: matrix.label == 'head' && always()
        continue-on-error: true
        run: |
          set +e
          for suite in test:slopbot test:notify test:fee-converter test:points; do
            bun run "$suite" 2>&1 | tee "$RUNNER_TEMP/evidence/${suite//:/-}.log"
            status=${PIPESTATUS[0]}
            echo "$status" > "$RUNNER_TEMP/evidence/${suite//:/-}.exit"
          done
          bun test ./scripts/staging-payments.test.ts ./backend/notifications ./backend/security ./workers/vetting/acquire.test.ts 2>&1 | tee "$RUNNER_TEMP/evidence/backend.log"
          status=${PIPESTATUS[0]}
          echo "$status" > "$RUNNER_TEMP/evidence/backend.exit"
      - name: Preserve logs and browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cross-branch-${{ matrix.label }}-${{ matrix.sha }}
          path: |
            ${{ runner.temp }}/evidence
            test-results
            playwright-report
          retention-days: 14
          if-no-files-found: error
      - name: Required result
        if: always()
        run: |
          test "${{ steps.focused.outcome }}" = success
          test "${{ steps.verify.outcome }}" = success
          if [ "${{ matrix.label }}" = head ]; then
            test "${{ steps.e2e.outcome }}" = success
          fi

