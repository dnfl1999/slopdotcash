name: Canonical-origin verification diagnostic
on:
  push:
    branches: [validation/cross-branch-9d2f937d-20261023]
permissions:
  contents: read
jobs:
  exact-revision:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base
            sha: 02d3055676ee8f6de8f5b692591040ea8039f9da
          - label: head
            sha: 9d2f937d4e9cbd63484ed986544666bbacb52401
    env:
      CI: "true"
      EXPECTED_SHA: ${{ matrix.sha }}
      SLOP_PROFILES_INPUT: data/profiles/seed.json
      SLOP_POINTS_ONLINE: "0"
      SLOP_POINTS_BOOTSTRAP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Verify exact source and install frozen dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(node --version)" = "v24.15.0"
          test "$(bun --version)" = "1.3.14"
          {
            uname -a
            pwd
            df -T .
            git rev-parse HEAD
            git remote -v
            node --version
            bun --version
          } | tee "$RUNNER_TEMP/evidence/environment.log"
          bun install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/evidence/install.log"
          python -m pip install --disable-pip-version-check PyYAML==6.0.3
          git diff --exit-code
      - name: Prepare required build input without registry refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run leaderboard:generate 2>&1 | tee "$RUNNER_TEMP/evidence/leaderboard-input.log"
      - name: Full verify in the canonical origin expected by escrow fixtures
        id: verify
        run: |
          original_origin="$(git remote get-url origin)"
          trap 'git remote set-url origin "$original_origin"' EXIT
          git remote set-url origin https://github.com/SlopDotCash/slopdotcash.git
          git remote -v | tee "$RUNNER_TEMP/evidence/diagnostic-remotes.log"
          set +e
          bun run verify 2>&1 | tee "$RUNNER_TEMP/evidence/verify-canonical-origin.log"
          status=${PIPESTATUS[0]}
          echo "$status" > "$RUNNER_TEMP/evidence/verify-canonical-origin.exit"
          exit "$status"
      - name: Confirm source and origin restored
        if: always()
        run: |
          git rev-parse HEAD
          git remote -v
          git diff --exit-code
      - name: Preserve complete diagnostic results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: canonical-origin-${{ matrix.label }}-${{ matrix.sha }}
          path: ${{ runner.temp }}/evidence
          retention-days: 14
          if-no-files-found: error

