name: Exact profile payment validation
on:
  push:
    branches: [validation/profile-payments-97245f2c]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base
            sha: ca44b20b
          - label: head
            sha: 97245f2cedc70b150641a7f995532a3e4b8d5f8b
    env:
      CI: "true"
      SLOP_PROFILES_INPUT: data/profiles/seed.json
      SLOP_POINTS_ONLINE: "0"
      SLOP_POINTS_BOOTSTRAP: "1"
      SLOP_E2E_WORKERS: "2"
      SLOP_E2E_VIDEO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Pin source and install lockfile
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          git rev-parse HEAD | tee "$RUNNER_TEMP/evidence/source.txt"
          test "$(git rev-parse HEAD)" = "$(git rev-parse '${{ matrix.sha }}')"
          node --version
          bun --version
          bun install --frozen-lockfile
          python -m pip install --disable-pip-version-check PyYAML==6.0.3
          git diff --exit-code
      - name: Generate the committed registry build input
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run leaderboard:generate 2>&1 | tee "$RUNNER_TEMP/evidence/build-input.log"
      - name: Complete verification with canonical fixture origin
        id: verify
        continue-on-error: true
        run: |
          previous_origin="$(git remote get-url origin)"
          trap 'git remote set-url origin "$previous_origin"' EXIT
          git remote set-url origin https://github.com/SlopDotCash/slopdotcash.git
          set +e
          bun run verify 2>&1 | tee "$RUNNER_TEMP/evidence/verify.log"
          status=${PIPESTATUS[0]}
          echo "$status" > "$RUNNER_TEMP/evidence/verify.exit"
          exit "$status"
      - name: Install browsers
        if: matrix.label == 'head'
        run: bun x playwright install --with-deps chromium firefox
      - name: Complete browser suite
        if: matrix.label == 'head'
        id: browser
        continue-on-error: true
        run: |
          set +e
          bun run test:e2e 2>&1 | tee "$RUNNER_TEMP/evidence/e2e.log"
          status=${PIPESTATUS[0]}
          echo "$status" > "$RUNNER_TEMP/evidence/e2e.exit"
          exit "$status"
      - name: Check source remains unchanged
        if: always()
        run: git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: profile-${{ matrix.label }}-${{ matrix.sha }}
          path: |
            ${{ runner.temp }}/evidence
            test-results
            playwright-report
          retention-days: 14
          if-no-files-found: error
      - name: Required results
        if: always()
        run: |
          test "${{ steps.verify.outcome }}" = success
          if [ '${{ matrix.label }}' = head ]; then
            test "${{ steps.browser.outcome }}" = success
          fi
