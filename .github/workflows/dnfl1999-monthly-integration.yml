name: dnfl1999 monthly merge Linux verification
'on':
  push:
    branches:
    - validation/monthly-integration-20261110
permissions:
  contents: read
concurrency:
  group: dnfl1999-monthly-integration-${{ github.ref }}
  cancel-in-progress: false
env:
  CI: 'true'
  CANDIDATE_SHA: 9a18baf10979a46107ef2bb4bbabaf2bcf18d60a
  SLOP_PROFILES_INPUT: data/profiles/seed.json
  SLOP_POINTS_ONLINE: '0'
  SLOP_POINTS_BOOTSTRAP: '1'
  VITE_SLOP_ENVIRONMENT: production
  WRANGLER_SEND_METRICS: 'false'
jobs:
  source:
    if: github.repository == 'dnfl1999/slopdotcash'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 9a18baf10979a46107ef2bb4bbabaf2bcf18d60a
        fetch-depth: 0
        persist-credentials: false
        submodules: false
    - name: Bind verification to the candidate
      run: |
        test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
        uname -a
        git rev-parse HEAD
        git status --short

        printf "QUINT_HOME=%s/dnfl1999-quint\n" "$RUNNER_TEMP" >> "$GITHUB_ENV"
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 24.15.0
        package-manager-cache: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '21'
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.3.14
        no-cache: true
    - name: Install pinned dependencies
      run: |
        test "$(node --version)" = "v24.15.0"
        test "$(bun --version)" = "1.3.14"
        bun --no-env-file install --frozen-lockfile --ignore-scripts
        printf '%s\n' 'PyYAML==6.0.3 --hash=sha256:0f29edc409a6392443abf94b9cf89ce99889a1dd5376d94316ae5145dfedd5d6' > "$RUNNER_TEMP/slop-python-requirements.txt"
        python -m pip install --disable-pip-version-check --require-hashes --requirement "$RUNNER_TEMP/slop-python-requirements.txt"
        git diff --exit-code
    - name: Prepare official public validation inputs
      run: |
        bun --no-env-file run projects:sync
        bun --no-env-file scripts/download-leaderboard.ts https://slop.cash/data/leaderboard.json "$RUNNER_TEMP/published-leaderboard.json"
        bun --no-env-file scripts/prepare-pr-ledger.ts "$RUNNER_TEMP/published-leaderboard.json" public/data/leaderboard.json
    - name: Install checked Dafny distribution
      run: bun --no-env-file run lemmascript:setup
    - name: Focused payment regression
      run: bun --no-env-file test --timeout 30000 ./backend/payments ./workers/payments ./formal/tests
    - name: Complete required root verification
      run: bun --no-env-file run verify
    - name: Required formatting check
      if: success() || failure()
      run: bun --no-env-file run format:check
    - name: Record source and proof receipts
      if: always()
      run: |
        git rev-parse HEAD
        sha256sum backend/payments/handler.ts backend/payments/chain-awards.ts backend/payments/monthly.test.ts formal/models/rewards/monthly_source_conflict.qnt
        git diff --exit-code -- backend/payments formal
        git status --short
        node --input-type=module <<'NODE'
        import fs from 'node:fs';
        for (const dir of ['evidence/formal','evidence/lemmascript']) {
          if (!fs.existsSync(dir)) continue;
          for (const item of fs.readdirSync(dir,{recursive:true,withFileTypes:true})) {
            if (item.isFile() && /(?:result|report).*\.json$/.test(item.name)) {
              const file=item.parentPath+'/'+item.name;
              console.log('PROOF_RECEIPT '+file+' '+fs.readFileSync(file,'utf8'));
            }
          }
        }
        NODE
  formal:
    if: github.repository == 'dnfl1999/slopdotcash'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 9a18baf10979a46107ef2bb4bbabaf2bcf18d60a
        fetch-depth: 0
        persist-credentials: false
        submodules: false
    - name: Bind verification to the candidate
      run: |
        test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
        uname -a
        git rev-parse HEAD
        git status --short

        printf "QUINT_HOME=%s/dnfl1999-quint\n" "$RUNNER_TEMP" >> "$GITHUB_ENV"
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 24.15.0
        package-manager-cache: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '21'
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.3.14
        no-cache: true
    - name: Install pinned dependencies
      run: |
        test "$(node --version)" = "v24.15.0"
        test "$(bun --version)" = "1.3.14"
        bun --no-env-file install --frozen-lockfile --ignore-scripts
        printf '%s\n' 'PyYAML==6.0.3 --hash=sha256:0f29edc409a6392443abf94b9cf89ce99889a1dd5376d94316ae5145dfedd5d6' > "$RUNNER_TEMP/slop-python-requirements.txt"
        python -m pip install --disable-pip-version-check --require-hashes --requirement "$RUNNER_TEMP/slop-python-requirements.txt"
        git diff --exit-code
    - name: Download the checksum-pinned official translator with GitHub CLI
      env:
        GH_TOKEN: ${{ github.token }}
      run: |-
        archive_dir="$RUNNER_TEMP/dnfl1999-apalache-release"
        mkdir "$archive_dir"
        gh release download v0.62.4 --repo apalache-mc/apalache --pattern apalache.tgz --dir "$archive_dir"
        printf '%s  %s\n' '8ac8488422c30d552735bae11b92a2d014d8e02e8608702acc08f9a2d8a9abb2' "$archive_dir/apalache.tgz" | sha256sum --check
        mkdir -p "$QUINT_HOME/apalache-dist-0.62.4"
        tar -xzf "$archive_dir/apalache.tgz" -C "$QUINT_HOME/apalache-dist-0.62.4"
    - name: Verify the pinned translator distribution
      run: |-
        node --input-type=module <<'NODE'
        import fs from 'node:fs';
        import path from 'node:path';
        import {createRequire} from 'node:module';
        import {createHash} from 'node:crypto';
        const require=createRequire(import.meta.url);
        const packageRoot=path.dirname(require.resolve('@informalsystems/quint/package.json'));
        const {fetchApalache}=require(path.join(packageRoot,'dist/src/apalache.js'));
        const {apalacheDistDir}=require(path.join(packageRoot,'dist/src/config.js'));
        const result=await fetchApalache('0.62.4',3);
        console.log('TRANSLATOR_DOWNLOAD_RESULT '+JSON.stringify({failed:result.isLeft(),detail:result.value}));
        if(result.isLeft())process.exit(1);
        const jar=path.join(apalacheDistDir('0.62.4'),'apalache/lib/apalache.jar');
        const digest=createHash('sha256').update(fs.readFileSync(jar)).digest('hex');
        console.log('TRANSLATOR_JAR_SHA256 '+digest);
        if(digest!=='e5223915507b65cc5f1638bd037ede60f8a4fc1644aff46355779f9b05df9262')throw new Error('Pinned JAR mismatch');
        NODE
    - name: Check actual translator and safety view
      env:
        SLOP_QUINT_TRANSLATOR_TEST: '1'
      run: bun --no-env-file test ./scripts/quint-local-translator.test.ts ./scripts/quint-safety-view.test.ts
    - name: Verify every model in this deterministic partition
      run: |
        node --input-type=module <<'NODE'
        import {listModels} from './scripts/formal-models.mjs';
        import {spawnSync} from 'node:child_process';
        import fs from 'node:fs';
        const all=listModels(process.cwd());
        const shard=Number(process.env.FORMAL_SHARD);
        const models=all.filter((_,i)=>i%4===shard).map(p=>p.slice(p.lastIndexOf('/')+1,-4));
        console.log('MODEL_PARTITION '+JSON.stringify({shard,total:all.length,models}));
        let failures=[];
        for(const model of models){
          const result=spawnSync(process.execPath,['scripts/check-formal.mjs','--verify','--model='+model],{stdio:'inherit'});
          if(result.status!==0)failures.push(model);
          const file='evidence/formal/verification-'+model+'.json';
          if(fs.existsSync(file))console.log('PROOF_RECEIPT '+file+' '+fs.readFileSync(file,'utf8'));
          else console.log('PROOF_RECEIPT_MISSING '+file);
        }
        console.log('PARTITION_RESULT '+JSON.stringify({shard,models:models.length,failures}));
        process.exitCode=failures.length?1:0;
        NODE
    - name: Record source and proof receipts
      if: always()
      run: |
        git rev-parse HEAD
        sha256sum backend/payments/handler.ts backend/payments/chain-awards.ts backend/payments/monthly.test.ts formal/models/rewards/monthly_source_conflict.qnt
        git diff --exit-code -- backend/payments formal
        git status --short
        node --input-type=module <<'NODE'
        import fs from 'node:fs';
        for (const dir of ['evidence/formal','evidence/lemmascript']) {
          if (!fs.existsSync(dir)) continue;
          for (const item of fs.readdirSync(dir,{recursive:true,withFileTypes:true})) {
            if (item.isFile() && /(?:result|report).*\.json$/.test(item.name)) {
              const file=item.parentPath+'/'+item.name;
              console.log('PROOF_RECEIPT '+file+' '+fs.readFileSync(file,'utf8'));
            }
          }
        }
        NODE
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 0
        - 1
        - 2
        - 3
    env:
      FORMAL_SHARD: ${{ matrix.shard }}
  browsers:
    if: github.repository == 'dnfl1999/slopdotcash'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        lane:
        - preview
        - pages
        - registry
    env:
      SLOP_E2E_LANE: ${{ matrix.lane }}
      SLOP_E2E_WORKERS: '2'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 9a18baf10979a46107ef2bb4bbabaf2bcf18d60a
        fetch-depth: 0
        persist-credentials: false
        submodules: false
    - name: Bind verification to the candidate
      run: |
        test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
        uname -a
        git rev-parse HEAD
        git status --short

        printf "QUINT_HOME=%s/dnfl1999-quint\n" "$RUNNER_TEMP" >> "$GITHUB_ENV"
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 24.15.0
        package-manager-cache: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '21'
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.3.14
        no-cache: true
    - name: Install pinned dependencies
      run: |
        test "$(node --version)" = "v24.15.0"
        test "$(bun --version)" = "1.3.14"
        bun --no-env-file install --frozen-lockfile --ignore-scripts
        printf '%s\n' 'PyYAML==6.0.3 --hash=sha256:0f29edc409a6392443abf94b9cf89ce99889a1dd5376d94316ae5145dfedd5d6' > "$RUNNER_TEMP/slop-python-requirements.txt"
        python -m pip install --disable-pip-version-check --require-hashes --requirement "$RUNNER_TEMP/slop-python-requirements.txt"
        git diff --exit-code
    - name: Prepare official public validation inputs
      run: |
        bun --no-env-file run projects:sync
        bun --no-env-file scripts/download-leaderboard.ts https://slop.cash/data/leaderboard.json "$RUNNER_TEMP/published-leaderboard.json"
        bun --no-env-file scripts/prepare-pr-ledger.ts "$RUNNER_TEMP/published-leaderboard.json" public/data/leaderboard.json
    - name: Install pinned local browser
      run: bun --no-env-file x playwright install --with-deps chromium firefox
    - name: Complete browser lane
      run: bun --no-env-file run test:e2e
    - name: Record source and proof receipts
      if: always()
      run: |
        git rev-parse HEAD
        sha256sum backend/payments/handler.ts backend/payments/chain-awards.ts backend/payments/monthly.test.ts formal/models/rewards/monthly_source_conflict.qnt
        git diff --exit-code -- backend/payments formal
        git status --short
        node --input-type=module <<'NODE'
        import fs from 'node:fs';
        for (const dir of ['evidence/formal','evidence/lemmascript']) {
          if (!fs.existsSync(dir)) continue;
          for (const item of fs.readdirSync(dir,{recursive:true,withFileTypes:true})) {
            if (item.isFile() && /(?:result|report).*\.json$/.test(item.name)) {
              const file=item.parentPath+'/'+item.name;
              console.log('PROOF_RECEIPT '+file+' '+fs.readFileSync(file,'utf8'));
            }
          }
        }
        NODE
  upstream_comparison:
    if: github.repository == 'dnfl1999/slopdotcash'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
        - label: latest-upstream
          revision: 6159e31374561d890194f357eba9530d5577ca96
          models: ui_bounty_payment_parent ui_solana_payment_pending
    env:
      CANDIDATE_SHA: ${{ matrix.revision }}
      MODELS: ${{ matrix.models }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ matrix.revision }}
        fetch-depth: 0
        persist-credentials: false
        submodules: false
    - name: Bind verification to the candidate
      run: |
        test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
        printf 'QUINT_HOME=%s/dnfl1999-quint\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
        uname -a
        git rev-parse HEAD
        git status --short
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 24.15.0
        package-manager-cache: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '21'
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.3.14
        no-cache: true
    - name: Install pinned dependencies
      run: |
        test "$(node --version)" = "v24.15.0"
        test "$(bun --version)" = "1.3.14"
        bun --no-env-file install --frozen-lockfile --ignore-scripts
        printf '%s\n' 'PyYAML==6.0.3 --hash=sha256:0f29edc409a6392443abf94b9cf89ce99889a1dd5376d94316ae5145dfedd5d6' > "$RUNNER_TEMP/slop-python-requirements.txt"
        python -m pip install --disable-pip-version-check --require-hashes --requirement "$RUNNER_TEMP/slop-python-requirements.txt"
        git diff --exit-code
    - name: Download the checksum-pinned official translator with GitHub CLI
      env:
        GH_TOKEN: ${{ github.token }}
      run: |-
        archive_dir="$RUNNER_TEMP/dnfl1999-apalache-release"
        mkdir "$archive_dir"
        gh release download v0.62.4 --repo apalache-mc/apalache --pattern apalache.tgz --dir "$archive_dir"
        printf '%s  %s\n' '8ac8488422c30d552735bae11b92a2d014d8e02e8608702acc08f9a2d8a9abb2' "$archive_dir/apalache.tgz" | sha256sum --check
        mkdir -p "$QUINT_HOME/apalache-dist-0.62.4"
        tar -xzf "$archive_dir/apalache.tgz" -C "$QUINT_HOME/apalache-dist-0.62.4"
    - name: Verify the pinned translator distribution
      run: |-
        node --input-type=module <<'NODE'
        import fs from 'node:fs';
        import path from 'node:path';
        import {createRequire} from 'node:module';
        import {createHash} from 'node:crypto';
        const require=createRequire(import.meta.url);
        const packageRoot=path.dirname(require.resolve('@informalsystems/quint/package.json'));
        const {fetchApalache}=require(path.join(packageRoot,'dist/src/apalache.js'));
        const {apalacheDistDir}=require(path.join(packageRoot,'dist/src/config.js'));
        const result=await fetchApalache('0.62.4',3);
        console.log('TRANSLATOR_DOWNLOAD_RESULT '+JSON.stringify({failed:result.isLeft(),detail:result.value}));
        if(result.isLeft())process.exit(1);
        const jar=path.join(apalacheDistDir('0.62.4'),'apalache/lib/apalache.jar');
        const digest=createHash('sha256').update(fs.readFileSync(jar)).digest('hex');
        console.log('TRANSLATOR_JAR_SHA256 '+digest);
        if(digest!=='e5223915507b65cc5f1638bd037ede60f8a4fc1644aff46355779f9b05df9262')throw new Error('Pinned JAR mismatch');
        NODE
    - name: Check actual translator and safety view
      env:
        SLOP_QUINT_TRANSLATOR_TEST: '1'
      run: bun --no-env-file test ./scripts/quint-local-translator.test.ts ./scripts/quint-safety-view.test.ts
    - name: Run unchanged selected model verification
      run: |-
        validation_exit=0
        for model in $MODELS; do
          if node scripts/check-formal.mjs --verify --model="$model"; then
            printf "PASS selected model %s\n" "$model"
          else
            validation_exit=1
          fi
        done
        exit "$validation_exit"
    - name: Preserve exact model receipts
      if: always()
      run: |-
        git rev-parse HEAD
        git diff --exit-code
        node --input-type=module <<'NODE'
        import fs from 'node:fs';
        for (const model of process.env.MODELS.split(' ')) {
          const file='evidence/formal/verification-'+model+'.json';
          if (!fs.existsSync(file)) { console.log('PROOF_RECEIPT_MISSING '+file); continue; }
          const receipt=JSON.parse(fs.readFileSync(file,'utf8'));
          console.log('PROOF_RECEIPT '+file+' '+JSON.stringify(receipt));
        }
        NODE
