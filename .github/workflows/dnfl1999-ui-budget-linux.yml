name: dnfl1999 Solana graph budget Linux QA
'on':
  push:
    branches:
    - validation/ui-budget-linux-20261109-06
permissions:
  contents: read
concurrency:
  group: dnfl1999-ui-budget-linux-${{ github.ref }}
  cancel-in-progress: false
env:
  CI: 'true'
  CANDIDATE_SHA: 3224b635880b27c99b774406ac6f99ac07426575
  SLOP_PROFILES_INPUT: data/profiles/seed.json
  SLOP_POINTS_ONLINE: '0'
  SLOP_POINTS_BOOTSTRAP: '1'
  VITE_SLOP_ENVIRONMENT: production
  WRANGLER_SEND_METRICS: 'false'
jobs:
  source:
    if: github.repository == 'dnfl1999/slopdotcash'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 3224b635880b27c99b774406ac6f99ac07426575
        fetch-depth: 1
        persist-credentials: false
        submodules: false
    - name: Bind verification to the candidate
      run: 'test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

        uname -a

        git rev-parse HEAD

        git status --short

        '
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 24.15.0
        package-manager-cache: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '21'
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.3.14
        no-cache: true
    - name: Install pinned dependencies
      run: 'test "$(node --version)" = "v24.15.0"

        test "$(bun --version)" = "1.3.14"

        bun --no-env-file install --frozen-lockfile --ignore-scripts

        printf ''%s\n'' ''PyYAML==6.0.3 --hash=sha256:0f29edc409a6392443abf94b9cf89ce99889a1dd5376d94316ae5145dfedd5d6'' > "$RUNNER_TEMP/slop-python-requirements.txt"

        python -m pip install --disable-pip-version-check --require-hashes --requirement "$RUNNER_TEMP/slop-python-requirements.txt"

        git diff --exit-code

        '
    - name: Prepare official public validation inputs
      run: 'bun --no-env-file run projects:sync

        bun --no-env-file scripts/download-leaderboard.ts https://slop.cash/data/leaderboard.json "$RUNNER_TEMP/published-leaderboard.json"

        bun --no-env-file scripts/prepare-pr-ledger.ts "$RUNNER_TEMP/published-leaderboard.json" public/data/leaderboard.json

        '
    - name: Install checked Dafny distribution
      run: bun --no-env-file run lemmascript:setup
    - name: Complete required root verification
      run: bun --no-env-file run verify
    - name: Required formatting check
      if: success() || failure()
      run: bun --no-env-file run format:check
    - name: Record source and proof receipts
      if: always()
      run: "git rev-parse HEAD\nsha256sum scripts/check-formal.mjs formal/inventory.json formal/lemmascript-inventory.json\ngit diff --exit-code -- scripts/check-formal.mjs formal/inventory.json formal/lemmascript-inventory.json\ngit status --short\nnode --input-type=module <<'NODE'\nimport fs from 'node:fs';\nconst files=['evidence/formal/checks.json'];\nif(fs.existsSync('evidence/lemmascript'))for(const dir of fs.readdirSync('evidence/lemmascript',{withFileTypes:true}))if(dir.isDirectory())files.push('evidence/lemmascript/'+dir.name+'/result.json');\nfor(const file of files){\n if(fs.existsSync(file))console.log('PROOF_RECEIPT '+file+' '+JSON.stringify(JSON.parse(fs.readFileSync(file,'utf8'))));\n}\nNODE"
  affected_formal:
    if: github.repository == 'dnfl1999/slopdotcash'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: 3224b635880b27c99b774406ac6f99ac07426575
      MODELS: ui_solana_payment_pending formal_process formal_toolchain formal_translation
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 3224b635880b27c99b774406ac6f99ac07426575
        fetch-depth: 1
        persist-credentials: false
        submodules: false
    - name: Bind verification to the candidate
      run: 'test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

        printf ''QUINT_HOME=%s/dnfl1999-quint\n'' "$RUNNER_TEMP" >> "$GITHUB_ENV"

        uname -a

        git rev-parse HEAD

        git status --short

        '
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 24.15.0
        package-manager-cache: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '21'
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.3.14
        no-cache: true
    - name: Install pinned dependencies
      run: 'test "$(node --version)" = "v24.15.0"

        test "$(bun --version)" = "1.3.14"

        bun --no-env-file install --frozen-lockfile --ignore-scripts

        printf ''%s\n'' ''PyYAML==6.0.3 --hash=sha256:0f29edc409a6392443abf94b9cf89ce99889a1dd5376d94316ae5145dfedd5d6'' > "$RUNNER_TEMP/slop-python-requirements.txt"

        python -m pip install --disable-pip-version-check --require-hashes --requirement "$RUNNER_TEMP/slop-python-requirements.txt"

        git diff --exit-code

        '
    - name: Download the checksum-pinned official translator with GitHub CLI
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'archive_dir="$RUNNER_TEMP/dnfl1999-apalache-release"

        mkdir "$archive_dir"

        gh release download v0.62.4 --repo apalache-mc/apalache --pattern apalache.tgz --dir "$archive_dir"

        printf ''%s  %s\n'' ''8ac8488422c30d552735bae11b92a2d014d8e02e8608702acc08f9a2d8a9abb2'' "$archive_dir/apalache.tgz" | sha256sum --check

        mkdir -p "$QUINT_HOME/apalache-dist-0.62.4"

        tar -xzf "$archive_dir/apalache.tgz" -C "$QUINT_HOME/apalache-dist-0.62.4"'
    - name: Verify the pinned translator distribution
      run: 'node --input-type=module <<''NODE''

        import fs from ''node:fs'';

        import path from ''node:path'';

        import {createRequire} from ''node:module'';

        import {createHash} from ''node:crypto'';

        const require=createRequire(import.meta.url);

        const packageRoot=path.dirname(require.resolve(''@informalsystems/quint/package.json''));

        const {fetchApalache}=require(path.join(packageRoot,''dist/src/apalache.js''));

        const {apalacheDistDir}=require(path.join(packageRoot,''dist/src/config.js''));

        const result=await fetchApalache(''0.62.4'',3);

        console.log(''TRANSLATOR_DOWNLOAD_RESULT ''+JSON.stringify({failed:result.isLeft(),detail:result.value}));

        if(result.isLeft())process.exit(1);

        const jar=path.join(apalacheDistDir(''0.62.4''),''apalache/lib/apalache.jar'');

        const digest=createHash(''sha256'').update(fs.readFileSync(jar)).digest(''hex'');

        console.log(''TRANSLATOR_JAR_SHA256 ''+digest);

        if(digest!==''e5223915507b65cc5f1638bd037ede60f8a4fc1644aff46355779f9b05df9262'')throw new Error(''Pinned JAR mismatch'');

        NODE'
    - name: Verify the fixed graph and mapped runner models
      run: "validation_exit=0\nfor model in $MODELS; do\n  if node scripts/check-formal.mjs --verify --model=\"$model\"; then\n    printf \"PASS selected model %s\\n\" \"$model\"\n  else\n    validation_exit=1\n  fi\ndone\nexit \"$validation_exit\""
    - name: Preserve exact model receipts
      if: always()
      run: "git rev-parse HEAD\ngit diff --exit-code\nnode --input-type=module <<'NODE'\nimport fs from 'node:fs';\nfor (const model of process.env.MODELS.split(' ')) {\n  const file='evidence/formal/verification-'+model+'.json';\n  if (!fs.existsSync(file)) { console.log('PROOF_RECEIPT_MISSING '+file); continue; }\n  const receipt=JSON.parse(fs.readFileSync(file,'utf8'));\n  console.log('PROOF_RECEIPT '+file+' '+JSON.stringify(receipt));\n}\nNODE"
