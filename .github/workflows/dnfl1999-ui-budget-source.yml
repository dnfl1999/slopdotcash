name: dnfl1999 Solana budget complete source QA
on:
  push:
    branches:
      - validation/ui-budget-source-20261109-07
permissions:
  contents: read
concurrency:
  group: dnfl1999-ui-budget-source-${{ github.ref }}
  cancel-in-progress: false
env:
  CI: "true"
  CANDIDATE_SHA: c8ea0ed6648ed531f21d49e77f4b475acc690c03
  SLOP_PROFILES_INPUT: data/profiles/seed.json
  SLOP_POINTS_ONLINE: "0"
  SLOP_POINTS_BOOTSTRAP: "1"
  VITE_SLOP_ENVIRONMENT: production
  WRANGLER_SEND_METRICS: "false"
jobs:
  source:
    if: github.repository == 'dnfl1999/slopdotcash'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c8ea0ed6648ed531f21d49e77f4b475acc690c03
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Bind verification to the candidate
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          uname -a
          git rev-parse HEAD
          git status --short
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
          no-cache: true
      - name: Install pinned dependencies
        run: |
          test "$(node --version)" = "v24.15.0"
          test "$(bun --version)" = "1.3.14"
          bun --no-env-file install --frozen-lockfile --ignore-scripts
          printf '%s\n' 'PyYAML==6.0.3 --hash=sha256:0f29edc409a6392443abf94b9cf89ce99889a1dd5376d94316ae5145dfedd5d6' > "$RUNNER_TEMP/slop-python-requirements.txt"
          python -m pip install --disable-pip-version-check --require-hashes --requirement "$RUNNER_TEMP/slop-python-requirements.txt"
          git diff --exit-code
      - name: Prepare official public validation inputs
        run: |
          bun --no-env-file run projects:sync
          bun --no-env-file scripts/download-leaderboard.ts https://slop.cash/data/leaderboard.json "$RUNNER_TEMP/published-leaderboard.json"
          bun --no-env-file scripts/prepare-pr-ledger.ts "$RUNNER_TEMP/published-leaderboard.json" public/data/leaderboard.json
      - name: Install checked Dafny distribution
        run: bun --no-env-file run lemmascript:setup
      - name: Complete required root verification
        run: bun --no-env-file run verify
      - name: Required formatting check
        if: success() || failure()
        run: bun --no-env-file run format:check
      - name: Record source and proof receipts
        if: always()
        run: |-
          git rev-parse HEAD
          sha256sum scripts/check-formal.mjs formal/inventory.json formal/lemmascript-inventory.json formal/state-catalog.json
          git diff --exit-code -- scripts/check-formal.mjs formal/inventory.json formal/lemmascript-inventory.json formal/state-catalog.json
          git status --short
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files=['evidence/formal/checks.json'];
          if(fs.existsSync('evidence/lemmascript'))for(const dir of fs.readdirSync('evidence/lemmascript',{withFileTypes:true}))if(dir.isDirectory())files.push('evidence/lemmascript/'+dir.name+'/result.json');
          for(const file of files){
           if(fs.existsSync(file))console.log('PROOF_RECEIPT '+file+' '+JSON.stringify(JSON.parse(fs.readFileSync(file,'utf8'))));
          }
          NODE
