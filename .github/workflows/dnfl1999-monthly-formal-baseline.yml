name: dnfl1999 monthly formal baseline comparison
on:
  push:
    branches:
      - validation/monthly-formal-baseline-20261109-04
permissions:
  contents: read
concurrency:
  group: dnfl1999-monthly-formal-${{ github.ref }}
  cancel-in-progress: false
env:
  CI: "true"
jobs:
  formal_compare:
    if: github.repository == 'dnfl1999/slopdotcash'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - label: upstream-timeouts
            revision: ac9da9e7dcd1b702311deb2c88438d6e13ccaf51
            models: ui_bounty_payment_parent ui_solana_payment_pending
    env:
      CANDIDATE_SHA: ${{ matrix.revision }}
      MODELS: ${{ matrix.models }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.revision }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Bind verification to the candidate
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          uname -a
          git rev-parse HEAD
          git status --short
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
          no-cache: true
      - name: Install pinned dependencies
        run: |
          test "$(node --version)" = "v24.15.0"
          test "$(bun --version)" = "1.3.14"
          bun --no-env-file install --frozen-lockfile --ignore-scripts
          printf '%s\n' 'PyYAML==6.0.3 --hash=sha256:0f29edc409a6392443abf94b9cf89ce99889a1dd5376d94316ae5145dfedd5d6' > "$RUNNER_TEMP/slop-python-requirements.txt"
          python -m pip install --disable-pip-version-check --require-hashes --requirement "$RUNNER_TEMP/slop-python-requirements.txt"
          git diff --exit-code
      - name: Diagnose and verify the pinned translator distribution
        run: |-
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {createRequire} from 'node:module';
          import {createHash} from 'node:crypto';
          const require=createRequire(import.meta.url);
          const packageRoot=path.dirname(require.resolve('@informalsystems/quint/package.json'));
          const {fetchApalache}=require(path.join(packageRoot,'dist/src/apalache.js'));
          const {apalacheDistDir}=require(path.join(packageRoot,'dist/src/config.js'));
          const result=await fetchApalache('0.62.4',3);
          console.log('TRANSLATOR_DOWNLOAD_RESULT '+JSON.stringify({failed:result.isLeft(),detail:result.value}));
          if(result.isLeft())process.exit(1);
          const jar=path.join(apalacheDistDir('0.62.4'),'apalache/lib/apalache.jar');
          const digest=createHash('sha256').update(fs.readFileSync(jar)).digest('hex');
          console.log('TRANSLATOR_JAR_SHA256 '+digest);
          if(digest!=='e5223915507b65cc5f1638bd037ede60f8a4fc1644aff46355779f9b05df9262')throw new Error('Pinned JAR mismatch');
          NODE
      - name: Check actual translator and safety view
        env:
          SLOP_QUINT_TRANSLATOR_TEST: "1"
        run: bun --no-env-file test ./scripts/quint-local-translator.test.ts ./scripts/quint-safety-view.test.ts
      - name: Run unchanged selected model verification
        run: |-
          validation_exit=0
          for model in $MODELS; do
            if node scripts/check-formal.mjs --verify --model="$model"; then
              printf "PASS selected model %s\n" "$model"
            else
              validation_exit=1
            fi
          done
          exit "$validation_exit"
      - name: Preserve exact model receipts
        if: always()
        run: |-
          git rev-parse HEAD
          git diff --exit-code
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const model of process.env.MODELS.split(' ')) {
            const file='evidence/formal/verification-'+model+'.json';
            if (!fs.existsSync(file)) { console.log('PROOF_RECEIPT_MISSING '+file); continue; }
            const receipt=JSON.parse(fs.readFileSync(file,'utf8'));
            console.log('PROOF_RECEIPT '+file+' '+JSON.stringify(receipt));
          }
          NODE
